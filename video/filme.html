<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>ROTAV3 — apresentação</title>
<style>
:root{
  --preto:#050c16; --navy:#0d1b2e; --ouro:#f3b62b; --ouro-claro:#f8d77a;
  --branco:#ffffff; --cinza:#9fb4d2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--preto);
  font-family:'Inter','Inter Display',sans-serif;-webkit-font-smoothing:antialiased}
#palco{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--preto)}

/* fundo: o mesmo mapa desenhado por nós, com deriva lenta durante o filme todo */
#fundo{position:absolute;inset:-14%;background-size:cover;background-position:center;opacity:.5}
#veu{position:absolute;inset:0;background:
  radial-gradient(130% 80% at 50% 8%, rgba(5,12,22,.18) 0%, rgba(5,12,22,.86) 62%, #050c16 100%)}
#grao{position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* faixa de texto, dentro da área segura do Reels */
#texto{position:absolute;left:72px;right:72px;top:232px}
.tit{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:76px;line-height:1.06;
  letter-spacing:-.028em;color:var(--branco);text-wrap:balance}
.sub{margin-top:20px;font-weight:500;font-size:40px;line-height:1.34;color:var(--cinza);letter-spacing:-.008em}
.lin{display:block;overflow:hidden}
.lin>span{display:block;will-change:transform,opacity}

/* palco das telas */
#cena{position:absolute;left:0;right:0;top:620px;height:1140px}
.card{position:absolute;left:50%;top:0;transform-origin:50% 0;border-radius:26px;overflow:hidden;
  box-shadow:0 36px 90px rgba(0,0,0,.62), 0 0 0 1px rgba(243,182,43,.14);background:#fff}
.card img{display:block;width:100%}
.lupa img{transform-origin:top center}
.fone{position:absolute;left:50%;top:0;border-radius:46px;overflow:hidden;background:#000;
  box-shadow:0 36px 90px rgba(0,0,0,.66), 0 0 0 10px #10203a, 0 0 0 11px rgba(243,182,43,.3)}
.fone img{display:block;width:100%}

/* pinos da abertura */
#abre{position:absolute;inset:0}
.pino{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:30px;
  background:#16a36a;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.55);will-change:transform,opacity}
.pino.c{background:var(--ouro);border-color:#fff;border-radius:7px;width:28px;height:28px;margin:-14px 0 0 -14px}
.pino.cd{background:#fff;border-color:var(--ouro);border-width:5px;width:40px;height:40px;margin:-20px 0 0 -20px}
#rota-abre{position:absolute;inset:0}

/* toques e rota sobre o mapa real */
.toque{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:40px;
  border:4px solid var(--ouro);will-change:transform,opacity}
#svg-rota{position:absolute;left:0;top:0;overflow:visible}
#svg-rota path{fill:none;stroke:var(--ouro);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 14px rgba(243,182,43,.55))}
.caminhao{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:52px;
  background:var(--ouro);border:4px solid #fff;box-shadow:0 0 22px rgba(243,182,43,.8);
  display:flex;align-items:center;justify-content:center;font-size:24px}

/* marca */
#marca{position:absolute;left:72px;top:118px;display:flex;align-items:center;gap:14px;opacity:.9}
#marca i{display:block;width:8px;height:30px;border-radius:3px;
  background:linear-gradient(180deg,var(--ouro-claro),#d8930c)}
#marca span{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:26px;
  letter-spacing:.02em;color:var(--branco)}
#marca b{font-weight:500;font-size:16px;letter-spacing:.34em;color:var(--cinza);display:block;margin-top:1px}

/* cartela final */
#fim{position:absolute;inset:0;background:var(--preto);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;opacity:0}
#fim .logo{display:flex;align-items:center;gap:22px}
#fim .logo i{width:16px;height:72px;border-radius:5px;background:linear-gradient(180deg,var(--ouro-claro),#d8930c)}
#fim .logo span{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:92px;
  letter-spacing:-.02em;color:#fff;line-height:1}
#fim .logo b{font-weight:500;font-size:26px;letter-spacing:.46em;color:var(--cinza);display:block;margin-top:8px}
#fim .frase{margin-top:54px;font-size:38px;font-weight:500;color:var(--cinza);text-align:center;line-height:1.45}
#fim .site{margin-top:44px;font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:46px;color:var(--ouro);letter-spacing:-.01em}
#fim .pe{position:absolute;bottom:150px;font-size:22px;color:#55657d}
</style></head><body>
<div id="palco">
  <div id="fundo"></div><div id="veu"></div>
  <div id="abre"></div>
  <div id="cena"></div>
  <div id="texto"></div>
  <div id="marca"><i></i><div><span>ROTAV3</span><b>SYSTEMS</b></div></div>
  <div id="grao"></div>
  <div id="fim">
    <div class="logo"><i></i><div><span>ROTAV3</span><b>SYSTEMS</b></div></div>
    <div class="frase">Roteirização para transportadoras<br>de 3 a 30 veículos</div>
    <div class="site">rotav3.com.br</div>
    <div class="pe">Imagens do sistema com dados de demonstração</div>
  </div>
</div>
<script src="roteiro.js"></script>
</body></html>
