[build]
builder = "NIXPACKS"
# Só redeploya quando algo dentro de backend/ muda. Os caminhos são contados a
# partir da raiz do repositório, mesmo com o Root Directory do serviço em backend/.
# Sem isto, cada mudança da tela ou dos testes reiniciava o servidor.
watchPatterns = ["/backend/**"]

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
# O Railway só troca para o deploy novo quando /health responder. Se o deploy novo
# não subir (biblioteca quebrada, erro de importação), o anterior continua no ar.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
